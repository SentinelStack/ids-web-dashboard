<div class="threat-map-wrap">
  <div #mapEl class="threat-map"></div>

  <div class="threat-legend">
    <span class="li"><i class="dot device"></i>Device</span>
    <span class="li"><i class="dot crit"></i>Critical / High</span>
    <span class="li"><i class="dot med"></i>Medium</span>
    <span class="li"><i class="dot low"></i>Low</span>
    <span class="count">{{ stats.arcs }} arcs · {{ stats.sources }} sources</span>
  </div>
</div>
